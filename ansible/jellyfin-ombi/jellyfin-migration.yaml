---
- name: Migrate Jellyfin between LXCs (FULL data, safe restore)
  hosts: lxc
  become: yes

  vars:
    jellyfin:
      service_name: jellyfin

    source_backup_dir: /tmp/jellyfin-backup
    restore_staging_dir: /tmp/jellyfin-restore
    backup_archive: /tmp/jellyfin-full.tar.gz

  tasks:
    # =====================================================
    # STOP JELLYFIN ON SOURCE
    # =====================================================
    - name: Stop Jellyfin on source host
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # PREPARE BACKUP DIR ON SOURCE
    # =====================================================
    - name: Create temporary Jellyfin backup directory on source
      ansible.builtin.file:
        path: "{{ source_backup_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # COPY SOURCE DATA (STRUCTURED)
    # =====================================================
    - name: Copy Jellyfin config (/etc/jellyfin)
      ansible.builtin.command:
        cmd: cp -a /etc/jellyfin "{{ source_backup_dir }}/config"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    - name: Copy Jellyfin data (/var/lib/jellyfin)
      ansible.builtin.command:
        cmd: cp -a /var/lib/jellyfin "{{ source_backup_dir }}/data"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # ARCHIVE BACKUP ON SOURCE
    # =====================================================
    - name: Create Jellyfin backup archive on source
      ansible.builtin.archive:
        path:
          - "{{ source_backup_dir }}/config"
          - "{{ source_backup_dir }}/data"
        dest: "{{ backup_archive }}"
        format: gz
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # RESTART SOURCE JELLYFIN
    # =====================================================
    - name: Restart Jellyfin on source
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # FETCH BACKUP TO CONTROL NODE
    # =====================================================
    - name: Fetch Jellyfin archive from source
      ansible.builtin.fetch:
        src: "{{ backup_archive }}"
        dest: /tmp/
        flat: yes
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # =====================================================
    # COPY BACKUP TO DESTINATION
    # =====================================================
    - name: Copy Jellyfin archive to destination
      ansible.builtin.copy:
        src: "{{ backup_archive }}"
        dest: "{{ backup_archive }}"

    # =====================================================
    # STOP JELLYFIN ON DESTINATION
    # =====================================================
    - name: Stop Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      ignore_errors: yes

    # =====================================================
    # CREATE RESTORE STAGING DIR
    # =====================================================
    - name: Create Jellyfin restore staging directory
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}"
        state: directory
        mode: "0755"

    # =====================================================
    # EXTRACT INTO STAGING (CRITICAL)
    # =====================================================
    - name: Extract Jellyfin archive into staging directory
      ansible.builtin.unarchive:
        src: "{{ backup_archive }}"
        dest: "{{ restore_staging_dir }}"
        remote_src: yes

    # =====================================================
    # MOVE INTO CORRECT LOCATIONS
    # =====================================================
    - name: Restore Jellyfin config to /etc/jellyfin
      ansible.builtin.command:
        cmd: mv "{{ restore_staging_dir }}/config" /etc/jellyfin

    - name: Restore Jellyfin data to /var/lib/jellyfin
      ansible.builtin.command:
        cmd: mv "{{ restore_staging_dir }}/data" /var/lib/jellyfin

    # =====================================================
    # FIX OWNERSHIP
    # =====================================================
    - name: Ensure correct ownership of Jellyfin files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: jellyfin
        group: jellyfin
        recurse: yes
      loop:
        - /etc/jellyfin
        - /var/lib/jellyfin

    # =====================================================
    # CLEAN UP TEMP FILES
    # =====================================================
    - name: Remove Jellyfin restore staging directory
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}"
        state: absent

    - name: Remove Jellyfin backup archive
      ansible.builtin.file:
        path: "{{ backup_archive }}"
        state: absent

    # =====================================================
    # START JELLYFIN ON DESTINATION
    # =====================================================
    - name: Start Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started
