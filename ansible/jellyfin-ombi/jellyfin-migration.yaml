---
- name: Migrate Jellyfin config between LXCs (full data)
  hosts: lxc
  become: yes

  vars:
    jellyfin:
      service_name: jellyfin
    backup_tmp_dir: /tmp/jellyfin-backup

  tasks:
    # -------------------------
    # STOP SOURCE SERVICE
    # -------------------------
    - name: Stop Jellyfin on source host
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # CREATE TEMP BACKUP DIR
    # -------------------------
    - name: Create temporary backup directory on source
      ansible.builtin.file:
        path: "{{ backup_tmp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # COPY CONFIG AND DATA ON SOURCE
    # -------------------------
    - name: Copy /etc/jellyfin to backup dir
      ansible.builtin.command:
        cmd: "cp -a /etc/jellyfin {{ backup_tmp_dir }}/config"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    - name: Copy /var/lib/jellyfin to backup dir
      ansible.builtin.command:
        cmd: "cp -a /var/lib/jellyfin {{ backup_tmp_dir }}/data"
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # ARCHIVE BACKUP
    # -------------------------
    - name: Archive Jellyfin backup on source host
      ansible.builtin.archive:
        path:
          - "{{ backup_tmp_dir }}/config"
          - "{{ backup_tmp_dir }}/data"
        dest: /tmp/jellyfin-full.tar.gz
        format: gz
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # FETCH ARCHIVE TO CONTROL NODE
    # -------------------------
    - name: Fetch Jellyfin archive from source host
      ansible.builtin.fetch:
        src: /tmp/jellyfin-full.tar.gz
        dest: /tmp/
        flat: yes
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # COPY TO DESTINATION
    # -------------------------
    - name: Copy Jellyfin archive to destination host
      ansible.builtin.copy:
        src: /tmp/jellyfin-full.tar.gz
        dest: /tmp/jellyfin-full.tar.gz

    # -------------------------
    # STOP DESTINATION SERVICE
    # -------------------------
    - name: Stop Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      ignore_errors: yes

    # -------------------------
    # MOVE EXISTING CONFIG OUT OF THE WAY
    # -------------------------
    - name: Backup existing Jellyfin directories on destination
      ansible.builtin.shell: |
        [ -d /etc/jellyfin ] && mv /etc/jellyfin /etc/jellyfin.bak
        [ -d /var/lib/jellyfin ] && mv /var/lib/jellyfin /var/lib/jellyfin.bak

    # -------------------------
    # EXTRACT ARCHIVE
    # -------------------------
    - name: Extract Jellyfin archive on destination
      ansible.builtin.unarchive:
        src: /tmp/jellyfin-full.tar.gz
        dest: /
        remote_src: yes

    # -------------------------
    # FIX OWNERSHIP
    # -------------------------
    - name: Ensure correct Jellyfin ownership
      ansible.builtin.file:
        path: /var/lib/jellyfin
        owner: jellyfin
        group: jellyfin
        recurse: yes

    - name: Ensure correct Jellyfin ownership (config)
      ansible.builtin.file:
        path: /etc/jellyfin
        owner: jellyfin
        group: jellyfin
        recurse: yes

    # -------------------------
    # START DESTINATION SERVICE
    # -------------------------
    - name: Start Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started

    # -------------------------
    # CLEANUP
    # -------------------------
    - name: Clean up Jellyfin archive and temporary backup dir on destination
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/jellyfin-full.tar.gz
        - "{{ backup_tmp_dir }}"

    # -------------------------
    # RESTART SOURCE SERVICE
    # -------------------------
    - name: Restart Jellyfin on source host
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"
