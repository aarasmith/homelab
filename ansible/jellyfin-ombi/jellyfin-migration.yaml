---
- name: Migrate Jellyfin config between LXCs (full data)
  hosts: lxc
  become: yes

  vars:
    jellyfin:
      service_name: jellyfin

  tasks:
    # -------------------------
    # STOP SOURCE SERVICE
    # -------------------------
    - name: Stop Jellyfin on source host
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # ARCHIVE SOURCE DATA
    # -------------------------
    - name: Archive Jellyfin config on source host
      ansible.builtin.shell: >
        tar czf /tmp/jellyfin-full.tar.gz
        -C / etc/jellyfin
        -C /var/lib/jellyfin .
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # FETCH TO CONTROL NODE
    # -------------------------
    - name: Fetch Jellyfin archive from source host
      ansible.builtin.fetch:
        src: /tmp/jellyfin-full.tar.gz
        dest: /tmp/
        flat: yes
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    # -------------------------
    # COPY TO DESTINATION
    # -------------------------
    - name: Copy Jellyfin archive to destination host
      ansible.builtin.copy:
        src: /tmp/jellyfin-full.tar.gz
        dest: /tmp/jellyfin-full.tar.gz

    # -------------------------
    # STOP DESTINATION SERVICE
    # -------------------------
    - name: Stop Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: stopped
      ignore_errors: yes

    # -------------------------
    # REMOVE EXISTING CONFIG
    # -------------------------
    - name: Remove existing Jellyfin config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/jellyfin
        - /var/lib/jellyfin

    # -------------------------
    # RECREATE DIRECTORIES
    # -------------------------
    - name: Recreate Jellyfin directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: jellyfin
        group: jellyfin
        mode: "0755"
      loop:
        - /etc/jellyfin
        - /var/lib/jellyfin

    # -------------------------
    # EXTRACT ARCHIVE
    # -------------------------
    - name: Extract Jellyfin config on destination
      ansible.builtin.unarchive:
        src: /tmp/jellyfin-full.tar.gz
        dest: /
        remote_src: yes

    # -------------------------
    # FIX OWNERSHIP
    # -------------------------
    - name: Ensure correct Jellyfin ownership
      ansible.builtin.file:
        path: /var/lib/jellyfin
        owner: jellyfin
        group: jellyfin
        recurse: yes

    # -------------------------
    # START DESTINATION SERVICE
    # -------------------------
    - name: Start Jellyfin on destination
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started

    # -------------------------
    # CLEANUP
    # -------------------------
    - name: Clean up Jellyfin archive
      ansible.builtin.file:
        path: /tmp/jellyfin-full.tar.gz
        state: absent

    # -------------------------
    # RESTART SOURCE SERVICE
    # -------------------------
    - name: Restart Jellyfin on source host
      ansible.builtin.service:
        name: "{{ jellyfin.service_name }}"
        state: started
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"
