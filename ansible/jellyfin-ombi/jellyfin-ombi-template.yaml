---
- name: Install Ombi and Jellyfin on Debian 12 (Bookworm)
  hosts: lxc
  become: true
  vars:
    # Ombi settings
    ombi_package: "ombi"
    ombi_key: "/etc/apt/keyrings/ombi.gpg"
    ombi_repo_file: "/etc/apt/sources.list.d/ombi.list"

    # Jellyfin settings
    jellyfin_package: "jellyfin"
    jellyfin_key: "/etc/apt/keyrings/jellyfin.gpg"
    jellyfin_repo_file: "/etc/apt/sources.list.d/jellyfin.list"

  tasks:
    - name: Ensure prerequisites are installed
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

# ------------------------
# OMBI SETUP
# ------------------------
    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Ombi GPG key
      get_url:
        url: "https://apt.ombi.app/pub.key"
        dest: "{{ ombi_key }}"
        mode: "0644"

    - name: Add Ombi apt repository
      copy:
        dest: "{{ ombi_repo_file }}"
        content: "deb [signed-by={{ ombi_key }}] https://apt.ombi.app/develop bookworm main\n"
        mode: "0644"

    - name: Update apt cache for Ombi
      apt:
        update_cache: yes

    - name: Install Ombi
      apt:
        name: "{{ ombi_package }}"
        state: present

    - name: Ensure Ombi service is enabled and running
      systemd:
        name: ombi
        enabled: yes
        state: started

# ------------------------
# JELLYFIN SETUP
# ------------------------
    - name: Download Jellyfin GPG key
      get_url:
        url: "https://repo.jellyfin.org/jellyfin_team.gpg.key"
        dest: "{{ jellyfin_key }}"
        mode: "0644"

    - name: Add Jellyfin apt repository
      copy:
        dest: "{{ jellyfin_repo_file }}"
        content: "deb [signed-by={{ jellyfin_key }}] https://repo.jellyfin.org/debian bookworm main\n"
        mode: "0644"

    - name: Update apt cache for Jellyfin
      apt:
        update_cache: yes

    - name: Install Jellyfin
      apt:
        name: "{{ jellyfin_package }}"
        state: present

    - name: Ensure Jellyfin service is enabled and running
      systemd:
        name: jellyfin
        enabled: yes
        state: started
