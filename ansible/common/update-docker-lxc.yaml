---
- name: Patch OS and update Docker containers
  hosts: lxc
  become: yes
  vars:
    docker_dir: /docker

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade

    - name: Log upgraded packages
      ansible.builtin.debug:
        msg: "{{ apt_upgrade.stdout_lines }}"
      when: apt_upgrade.stdout_lines is defined

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 120
      when: reboot_required.stat.exists

    - name: Pull latest Docker images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ docker_dir }}"
      register: docker_pull

    - name: Log pulled images
      ansible.builtin.debug:
        msg: "{{ docker_pull.stdout_lines }}"
      when: docker_pull.stdout_lines is defined

    - name: Recreate containers with new images
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ docker_dir }}"

    - name: Prune old images
      ansible.builtin.command:
        cmd: docker image prune -f
      register: prune_output

    - name: Log pruned images
      ansible.builtin.debug:
        msg: "{{ prune_output.stdout_lines }}"
      when: prune_output.stdout_lines is defined