- name: Mount nfs on host node to unprivileged LXC
  hosts: pve_host
  become: yes
  tasks:
    - name: Check if mp0 is already configured
      command: pct config {{ vmid }}
      register: pct_config
      changed_when: false

    - name: Add mount point
      command: pct set {{ vmid }} -mp0 /mnt/media ,mp=/mnt/data
      when: "'mp0: /mnt/media,mp=/mnt/data' not in pct_config.stdout"