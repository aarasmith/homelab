---
- name: Migrate Ombi config from Docker host to bare-metal LXC
  hosts: lxc
  become: yes

  vars:
    ombi:
      container_name: ombi
      source_config_path: /docker/appdata/ombi/config
      dest_data_path: /etc/Ombi
      service_name: ombi
      user: ombi
      group: nogroup

  tasks:
    - name: Stop Ombi container on source host
      ansible.builtin.shell: docker stop {{ ombi.container_name }}
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    - name: Archive Ombi config on source host
      ansible.builtin.shell: >
        tar czf /tmp/ombi-config.tar.gz -C {{ ombi.source_config_path }} .
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    - name: Fetch Ombi archive from source host
      ansible.builtin.fetch:
        src: /tmp/ombi-config.tar.gz
        dest: /tmp/
        flat: yes
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"

    - name: Copy Ombi archive to destination host
      ansible.builtin.copy:
        src: /tmp/ombi-config.tar.gz
        dest: /tmp/ombi-config.tar.gz

    - name: Stop Ombi service on destination
      ansible.builtin.service:
        name: "{{ ombi.service_name }}"
        state: stopped
      ignore_errors: yes

    - name: Remove existing Ombi storage directory
      ansible.builtin.file:
        path: "{{ ombi.dest_data_path }}"
        state: absent

    - name: Recreate Ombi storage directory
      ansible.builtin.file:
        path: "{{ ombi.dest_data_path }}"
        state: directory
        owner: "{{ ombi.user }}"
        group: "{{ ombi.group }}"
        mode: "0755"

    - name: Extract Ombi config to storage directory
      ansible.builtin.unarchive:
        src: /tmp/ombi-config.tar.gz
        dest: "{{ ombi.dest_data_path }}"
        remote_src: yes
        owner: "{{ ombi.user }}"
        group: "{{ ombi.group }}"

    - name: Start Ombi service on destination
      ansible.builtin.service:
        name: "{{ ombi.service_name }}"
        state: started

    - name: Clean up Ombi archive
      ansible.builtin.file:
        path: /tmp/ombi-config.tar.gz
        state: absent

    - name: Restart Ombi container on source host
      ansible.builtin.shell: docker start {{ ombi.container_name }}
      delegate_to: "{{ source_host }}"
      remote_user: "{{ source_user }}"
