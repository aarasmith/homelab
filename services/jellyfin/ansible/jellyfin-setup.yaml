---
- name: Install Ombi and Jellyfin on Debian 12
  hosts: lxc
  become: true

  tasks:
    - name: Ensure prerequisites are installed
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Jellyfin GPG key and dearmor it
      shell: |
        curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key \
        | gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
      args:
        creates: /etc/apt/keyrings/jellyfin.gpg

    - name: Ensure Jellyfin key has correct permissions
      file:
        path: /etc/apt/keyrings/jellyfin.gpg
        mode: "0644"

    - name: Add Jellyfin apt repository
      copy:
        dest: /etc/apt/sources.list.d/jellyfin.sources
        content: |
          Types: deb
          URIs: https://repo.jellyfin.org/debian
          Suites: bookworm
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/jellyfin.gpg
        mode: "0644"

    - name: Install Jellyfin
      apt:
        name: jellyfin
        state: present
        update_cache: yes

    - name: Ensure Jellyfin service is enabled and running
      systemd:
        name: jellyfin
        enabled: yes
        state: started
