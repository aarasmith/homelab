---
- name: Deploy Airflow stack (template build)
  hosts: lxc
  become: yes
  vars:
    service_dir: "{{ playbook_dir }}/.."
    remote_dir: /docker
    compose_file: docker-compose.yaml
    docker_images:
      - apache/airflow:2.9.3
      - postgres:16-alpine

  vars_files:
    - "{{ playbook_dir }}/vault.yaml"

  tasks:
    - name: Ensure remote docker directory exists
      file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yaml to remote host
      copy:
        src: "{{ service_dir }}/{{ compose_file }}"
        dest: "{{ remote_dir }}/{{ compose_file }}"
        owner: root
        group: root
        mode: '0644'

    - name: Ensure backup script directory exists
      file:
        path: /usr/local/bin
        state: directory
        mode: '0755'

    - name: Write backup script
      copy:
        dest: /usr/local/bin/airflow-backup
        mode: '0755'
        content: |
          #!/bin/bash
          # Backs up airflow postgres volume and dags volume to /backup/airflow/
          set -e
          BACKUP_DIR="/backup/airflow"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p "$BACKUP_DIR"

          echo "==> Dumping Airflow postgres..."
          docker exec airflow-postgres pg_dumpall -U airflow > "$BACKUP_DIR/postgres-$TIMESTAMP.sql"

          echo "==> Archiving DAGs..."
          docker run --rm \
            -v airflow_dags:/dags:ro \
            -v "$BACKUP_DIR":/out \
            alpine tar czf /out/dags-$TIMESTAMP.tar.gz -C /dags .

          echo "==> Backup complete: $BACKUP_DIR"
          ls -lh "$BACKUP_DIR"

    - name: Write restore script
      copy:
        dest: /usr/local/bin/airflow-restore
        mode: '0755'
        content: |
          #!/bin/bash
          # Usage: airflow-restore <postgres-dump.sql> [dags-archive.tar.gz]
          # Restores postgres dump and optionally dags into running stack.
          set -e
          BACKUP_DIR="/backup/airflow"
          PG_DUMP="$1"
          DAGS_ARCHIVE="$2"

          if [ -z "$PG_DUMP" ]; then
            echo "Usage: airflow-restore <postgres-dump.sql> [dags-archive.tar.gz]"
            echo ""
            echo "Available backups in $BACKUP_DIR:"
            ls -lh "$BACKUP_DIR" 2>/dev/null || echo "  (none found)"
            exit 1
          fi

          echo "==> Stopping Airflow services (keeping postgres up)..."
          cd /docker
          docker compose stop airflow-webserver airflow-scheduler airflow-triggerer airflow-init

          echo "==> Dropping and recreating database..."
          docker exec airflow-postgres psql -U airflow -c "DROP DATABASE IF EXISTS airflow;"
          docker exec airflow-postgres psql -U airflow -c "CREATE DATABASE airflow OWNER airflow;"

          echo "==> Restoring postgres dump..."
          docker exec -i airflow-postgres psql -U airflow < "$PG_DUMP"

          if [ -n "$DAGS_ARCHIVE" ]; then
            echo "==> Restoring DAGs..."
            docker run --rm \
              -v airflow_dags:/dags \
              -v "$(dirname "$DAGS_ARCHIVE")":/src:ro \
              alpine sh -c "cd /dags && tar xzf /src/$(basename "$DAGS_ARCHIVE")"
          fi

          echo "==> Running db migrate to ensure schema is current..."
          docker compose run --rm airflow-init

          echo "==> Starting services..."
          docker compose up -d

          echo "==> Restore complete."

    - name: Write .env placeholder (populated post-deploy)
      copy:
        dest: "{{ remote_dir }}/.env"
        mode: '0600'
        content: |
          # Populated at deploy time by lxc-ansible workflow.
          # Do not edit manually — managed by CI/CD.

    - name: Ensure backup directory exists
      file:
        path: /backup/airflow
        state: directory
        mode: '0700'

    - name: Pre-pull required images
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
      loop: "{{ docker_images }}"