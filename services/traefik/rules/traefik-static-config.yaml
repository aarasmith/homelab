entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"
    http:
      tls:
        options: "tls-opts@file"
    forwardedHeaders:
      trustedIPs:
        # Local networks
        - "127.0.0.1/32"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
        # Cloudflare IPs
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
  ssh:
    address: ":2222"

api:
  dashboard: true
  insecure: true

log:
  level: "WARN"
  filePath: "/logs/traefik.log"

accessLog:
  filePath: "/logs/access.log"

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
  file:
    directory: "/rules"
    watch: true

certificatesResolvers:
  cloudflare:
    acme:
      email: "{{ CF_EMAIL }}"
      storage: "/acme.json"
      dnsChallenge:
        provider: "cloudflare"
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
