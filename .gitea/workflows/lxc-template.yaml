name: Deploy LXC template

on:
  workflow_call:
    inputs:
      template_name:
        description: "Name for LXC template"
        required: true
        type: string
      lxc_name:
        description: "Name of the lxc to look up"
        required: true
        type: string
      ostemplate:
        description: "Location of the base OS template"
        required: true
        type: string
      enable_docker:
        description: "Enable keyctl/nesting in LXC"
        required: false
        default: "false"
      unprivileged:
        description: "Should LXC be unprivileged"
        required: true
        type: string
    secrets: inherit

jobs:
  select-env:
    uses: ./.gitea/workflows/configure-pve-environment.yaml
    with:
      branch: ${{ github.ref_name }}
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    needs: select-env

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Resolve pm_node_name
        id: resolve-node-name
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "pm_node_name=${{ inputs.pm_node_name }}" >> $GITHUB_OUTPUT
          else
            echo "pm_node_name=${{ vars.DEV_PVE_NODE_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Create credentials.auto.tfvars
        run: |
          cat > terraform/modules/lxc/credentials.auto.tfvars <<EOF
          pm_user         = "${{ needs.select-env.outputs.pm_user }}"
          pm_password     = "${{ needs.select-env.outputs.pm_password }}"
          lxc_password    = "${{ secrets.LXC_PASSWORD }}"
          ssh_public_key  = "${{ secrets.MASTER_SSH_PUBLIC_KEY }}"
          EOF

      - name: Create vars.auto.tfvars
        run: |
          cat > terraform/modules/lxc/vars.auto.tfvars <<EOF
          gateway         = "${{ vars.GATEWAY }}"
          storage         = "${{ needs.select-env.outputs.pm_disk_storage }}"
          ostemplate      = "${{ inputs.ostemplate }}"
          hostname        = "${{ inputs.lxc_name }}-template"
          enable_docker   = ${{ inputs.enable_docker }}
          unprivileged    = ${{ inputs.unprivileged }}
          pm_node_name    = "${{ steps.resolve-node-name.outputs.pm_node_name }}"
          pm_api_url      = "${{ needs.select-env.outputs.pm_api_url }}"
          EOF


      - name: Terraform Init
        run: terraform -chdir=terraform/modules/lxc init -input=false

      - name: Terraform Plan
        run: terraform -chdir=terraform/modules/lxc plan -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform -chdir=terraform/modules/lxc apply -input=false -auto-approve tfplan

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MASTER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ needs.select-env.outputs.pm_node_ip }} >> ~/.ssh/known_hosts
      
      - name: Lookup VMID and IP for the target LXC
        run: |
          sleep 15
          VMID=$(ssh -oBatchMode=yes root@${{ needs.select-env.outputs.pm_node_ip }} \
            "pvesh get /cluster/resources --type vm --output-format yaml \
            | awk -v target='${{ inputs.lxc_name }}-template' '
                /^[[:space:]]*name:/ {
                  split(\$0, a, \": \")
                  if (a[2] == target) found=1
                }
                found && /^[[:space:]]*vmid:/ {print \$2; exit}'")

          if [ -z "$VMID" ]; then
            echo "ERROR: VMID not found for ${{ inputs.lxc_name }}-template"
            exit 1
          fi

          IP=$(ssh -oBatchMode=yes root@${{ needs.select-env.outputs.pm_node_ip }} \
            "pct exec $VMID ip addr show | grep -oP '(?<=inet )10\.1\.1\.\d+'")

          echo "LXC_VMID=$VMID" >> $GITHUB_ENV
          echo "LXC_IP=$IP" >> $GITHUB_ENV

      - name: Render hosts.ini
        run: |
          cat > hosts.ini <<EOF
          [lxc]
          ${{ inputs.lxc_name }} ansible_host=${LXC_IP} ansible_user=root

          [pve_host]
          pve ansible_host=${{ needs.select-env.outputs.pm_node_ip }} ansible_user=root

          [pve_host:vars]
          vmid=${LXC_VMID}
          template_name=${{ inputs.template_name }}
          templates_dir=${{ vars.TEMPLATES_DIR }}
          EOF

      - name: debug hosts.ini
        run: cat hosts.ini

      - name: inject ansible pve task
        if: ${{ github.ref_name == 'main' }}
        run: |
          echo "\n- import_playbook: ../common/dump-lxc-to-template.yaml" >> ansible/${{ inputs.lxc_name }}/${{ inputs.lxc_name }}-template.yaml

      - name: Run Ansible Playbook
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-playbook -i hosts.ini ansible/${{ inputs.lxc_name }}/${{ inputs.lxc_name }}-template.yaml
        
      - name: Terraform Destroy
        if: ${{ github.ref_name == 'main' || failure() }}
        run: terraform -chdir=terraform/modules/lxc destroy -auto-approve -input=false
