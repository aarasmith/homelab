name: Traefik config update

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "ansible/traefik/rules/**"
      - "ansible/traefik/authelia/access_control.yaml"
      - "ansible/traefik/authelia/configuration.yaml"
  workflow_dispatch:

jobs:
  update-traefik:
    if: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) }}
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: traefik
      playbook: ansible/traefik/traefik-update.yaml
    secrets: inherit
    