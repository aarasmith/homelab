name: common | lxc-terraform

on:
  workflow_call:
    inputs:
      target_node:
        description: "Name for PVE node to deploy on"
        required: true
        type: string
      lxc_name:
        description: "Hostname of the LXC"
        required: true
        type: string
      base_template:
        description: "name of the base os template"
        required: true
        type: string
      vmid:
        description: "VMID for the LXC"
        required: true
        type: string
      ip:
        description: "IP address for the LXC"
        required: true
        type: string
      memory:
        description: "Memory in MB for the LXC"
        required: true
        type: string
      cores:
        description: "Number of cores for the LXC"
        required: true
        type: string
      storage_size:
        description: "Size of the LXC disk e.g. 16G"
        required: true
        type: string
      enable_docker:
        description: "Should keyctl and nesting be enabled so docker can run"
        required: true
        type: string
      unprivileged:
        description: "Should lxc be unprivileged"
        required: true
        type: string
      apply:
        description: "Whether to run terraform apply (set false for plan-only)"
        required: false
        type: string
        default: 'false'
    outputs:
      created:
        description: "Whether the LXC was just created"
        value: ${{ jobs.deploy.outputs.created }}
    secrets: inherit

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      created: ${{ steps.apply.outputs.created }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scope AWS vars to current environment
        id: scope-aws
        uses: ./.gitea/actions/scope-aws-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}

      - name: Scope PVE vars to current environment
        id: scope-pve
        uses: ./.gitea/actions/scope-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}

      - name: Create pve-provider.auto.tfvars
        run: |
          cat > terraform/modules/lxc/pve-provider.auto.tfvars <<EOF
          pm_user         = "${{ steps.scope-pve.outputs.pve_user }}"
          pm_password     = "${{ steps.scope-pve.outputs.pve_password }}"
          pm_api_url      = "${{ steps.scope-pve.outputs.pve_api_url }}"
          EOF
      
      - name: Lookup environment
        id: lookup-env
        uses: ./.gitea/actions/lookup-env

      - name: Create vars.auto.tfvars
        run: |
          cat > terraform/modules/lxc/vars.auto.tfvars <<EOF
          lxc_password   = "${{ secrets.LXC_PASSWORD }}"
          ssh_public_key = "${{ secrets.MASTER_SSH_PUBLIC_KEY }}"
          gateway        = "${{ vars.GATEWAY }}"
          storage        = "${{ steps.scope-pve.outputs.pve_disk_storage }}"
          target_node    = "${{ steps.lookup-env.outputs.env == 'prod' && inputs.target_node || vars.PVE_DEFAULT_NODE_DEV }}"
          hostname       = "${{ inputs.lxc_name }}"
          ostemplate     = "${{ (steps.lookup-env.outputs.env == 'prod' && 'truenas' || 'local') }}:vztmpl/${{ inputs.base_template }}"
          vmid           = "${{ inputs.vmid }}"
          ip             = "${{ inputs.ip }}"
          memory         = ${{ inputs.memory }}
          cores          = ${{ inputs.cores }}
          storage_size   = "${{ inputs.storage_size }}"
          enable_docker  = ${{ inputs.enable_docker }}
          unprivileged   = ${{ inputs.unprivileged }}
          EOF

      - name: Generate backend.tf
        run: |
          cat > terraform/modules/lxc/backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket = "${{ steps.scope-aws.outputs.aws_tf_backend_bucket }}"
              region = "${{ vars.AWS_REGION }}"
              key    = "${{ inputs.lxc_name }}.tfstate"
            }
          }
          EOF

      - name: Debug backend.tf
        run: cat terraform/modules/lxc/backend.tf

      - name: Terraform Init
        run: terraform -chdir=terraform/modules/lxc init -input=false

      - name: Terraform Refresh
        run: terraform -chdir=terraform/modules/lxc refresh -input=false

      - name: Terraform Plan
        run: terraform -chdir=terraform/modules/lxc plan -out=tfplan -input=false

      - name: Terraform Apply
        id: apply
        if: ${{ inputs.apply == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          terraform -chdir=terraform/modules/lxc apply -input=false -auto-approve tfplan | tee /tmp/tf_output.txt
          if grep -q "^Apply complete! Resources: [1-9][0-9]* added" /tmp/tf_output.txt; then
            echo "created=true" >> $GITHUB_OUTPUT
          fi