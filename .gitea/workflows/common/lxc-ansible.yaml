name: common | lxc-ansible

on:
  workflow_call:
    inputs:
      lxc_name:
        description: "Name of the lxc to look up"
        required: true
        type: string
      playbook:
        description: "Absolute path to the ansible playbook to run"
        required: true
        type: string
      extra_vars:
        description: "Optional extra vars to pass to ansible-playbook (space-separated key=value pairs)"
        required: false
        type: string
        default: ""
    secrets: inherit

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh_private_key: ${{ secrets.MASTER_SSH_PRIVATE_KEY }}

      # figure out which node to scope to
      - name: Lookup LXC VMID and node
        id: lxc
        uses: ./.gitea/actions/lookup-lxc-vmid-node
        with:
          lxc_name: ${{ inputs.lxc_name }}
      
      # scope to the PVE node that hosts the LXC
      - name: Scope PVE vars to current environment
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}
          target_node: ${{ steps.lxc.outputs.node }}

      - name: Lookup LXC IP
        uses: ./.gitea/actions/lookup-lxc-ip
        with:
          lxc_node_ip: ${PVE_NODE_IP}
          vmid: ${{ steps.lxc.outputs.vmid }}

      - name: Render hosts.ini
        run: |
          cat > hosts.ini <<EOF
          [lxc]
          ${{ inputs.lxc_name }} ansible_host=${LXC_IP} ansible_user=root

          [pve_host]
          pve ansible_host=${PVE_NODE_IP} ansible_user=root

          [pve_host:vars]
          lxc_name=${{ inputs.lxc_name }}
          vmid=${{ steps.lxc.outputs.vmid }}
          EOF

      - name: Debug hosts.ini
        run: cat hosts.ini

      - name: Run Ansible Playbook
        shell: bash
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          EXTRA_VARS="${{ inputs.extra_vars }}"
          ansible-playbook -i hosts.ini ${{ inputs.playbook }} \
            --vault-password-file <(echo "$ANSIBLE_VAULT_PASSWORD") \
            ${EXTRA_VARS:+--extra-vars "$EXTRA_VARS"}