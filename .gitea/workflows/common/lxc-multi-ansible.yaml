name: common | lxc-multi-ansible

on:
  workflow_call:
    inputs:
      playbook:
        description: "Path to the ansible playbook to run"
        required: true
        type: string
      lxc_name_1:
        description: "Name of the first LXC"
        required: true
        type: string
      lxc_name_2:
        description: "Name of the second LXC"
        required: true
        type: string
      lxc_name_3:
        description: "Name of the third LXC"
        required: true
        type: string
      lxc_ip_1:
        description: "IP address of the first LXC (without CIDR)"
        required: true
        type: string
      lxc_ip_2:
        description: "IP address of the second LXC (without CIDR)"
        required: true
        type: string
      lxc_ip_3:
        description: "IP address of the third LXC (without CIDR)"
        required: true
        type: string
      group_name:
        description: "Ansible inventory group name for the LXCs"
        required: true
        type: string
    secrets: inherit

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh_private_key: ${{ secrets.MASTER_SSH_PRIVATE_KEY }}

      - name: Lookup VMID and node for LXC 1
        id: lxc-1
        uses: ./.gitea/actions/lookup-lxc-vmid-node
        with:
          lxc_name: ${{ inputs.lxc_name_1 }}

      - name: Scope PVE vars for LXC 1 node
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}
          target_node: ${{ steps.lxc-1.outputs.node }}

      - name: Store LXC 1 PVE node IP
        run: echo "LXC_1_PVE_NODE_IP=${PVE_NODE_IP}" >> $GITHUB_ENV

      - name: Lookup VMID and node for LXC 2
        id: lxc-2
        uses: ./.gitea/actions/lookup-lxc-vmid-node
        with:
          lxc_name: ${{ inputs.lxc_name_2 }}

      - name: Scope PVE vars for LXC 2 node
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}
          target_node: ${{ steps.lxc-2.outputs.node }}

      - name: Store LXC 2 PVE node IP
        run: echo "LXC_2_PVE_NODE_IP=${PVE_NODE_IP}" >> $GITHUB_ENV

      - name: Lookup VMID and node for LXC 3
        id: lxc-3
        uses: ./.gitea/actions/lookup-lxc-vmid-node
        with:
          lxc_name: ${{ inputs.lxc_name_3 }}

      - name: Scope PVE vars for LXC 3 node
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}
          target_node: ${{ steps.lxc-3.outputs.node }}

      - name: Store LXC 3 PVE node IP
        run: echo "LXC_3_PVE_NODE_IP=${PVE_NODE_IP}" >> $GITHUB_ENV

      - name: Render hosts.ini
        run: |
          cat > hosts.ini <<EOF
          [${{ inputs.group_name }}]
          ${{ inputs.lxc_name_1 }} ansible_host=${{ inputs.lxc_ip_1 }} ansible_user=root
          ${{ inputs.lxc_name_2 }} ansible_host=${{ inputs.lxc_ip_2 }} ansible_user=root
          ${{ inputs.lxc_name_3 }} ansible_host=${{ inputs.lxc_ip_3 }} ansible_user=root

          [${{ inputs.group_name }}:vars]
          broker_1_ip=${{ inputs.lxc_ip_1 }}
          broker_2_ip=${{ inputs.lxc_ip_2 }}
          broker_3_ip=${{ inputs.lxc_ip_3 }}

          [pve_host]
          pve-1 ansible_host=${LXC_1_PVE_NODE_IP} ansible_user=root
          pve-2 ansible_host=${LXC_2_PVE_NODE_IP} ansible_user=root
          pve-3 ansible_host=${LXC_3_PVE_NODE_IP} ansible_user=root
          EOF

      - name: Debug hosts.ini
        run: cat hosts.ini

      - name: Run Ansible Playbook
        shell: bash
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: ansible-playbook -i hosts.ini ${{ inputs.playbook }} --vault-password-file <(echo "$ANSIBLE_VAULT_PASSWORD")