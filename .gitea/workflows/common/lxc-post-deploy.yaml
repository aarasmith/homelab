name: common | post-deploy

on:
  workflow_call:
    inputs:
      lxc_name:
        description: "Name of the LXC to ensure is running"
        required: true
        type: string
    secrets: inherit

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup an SSH key on the CI/CD runner so it can access the PVE nodes
      - name: Setup SSH key
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh_private_key: ${{ secrets.MASTER_SSH_PRIVATE_KEY }}

      # Figure out which node LXC is on so we can scope to it before running commands
      - name: Lookup LXC VMID and node
        id: lxc
        uses: ./.gitea/actions/lookup-lxc-vmid-node
        with:
          lxc_name: ${{ inputs.lxc_name }}

      - name: Scope PVE vars to current environment and target node
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}
          target_node: ${{ steps.lxc.outputs.node }}

      # This requires that PVE vars are scoped to the correct environment AND node which hosts the LXC
      - name: Ensure LXC is running
        run: ssh -oBatchMode=yes root@${PVE_NODE_IP} "pct start ${{ steps.lxc.outputs.vmid }} || true"

      - name: Sleep to allow LXC to come online
        run: sleep 15