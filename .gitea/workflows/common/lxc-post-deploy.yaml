name: common | post-deploy

on:
  workflow_call:
    inputs:
      vmid:
        description: "VMID of the LXC to ensure is running"
        required: true
        type: string
    secrets: inherit

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scope PVE vars to current environment
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MASTER_SSH_PRIVATE_KEY }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${PVE_NODE_IP} >> ~/.ssh/known_hosts

      - name: Ensure LXC is running
        run: ssh -oBatchMode=yes root@${PVE_NODE_IP} "pct start ${{ inputs.vmid }} || true"

      - name: Sleep to allow LXC to come online
        run: sleep 15