name: Postgres17 LXC template CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "ansible/postgres17/postgres17-template.yaml"
      - "terraform/modules/lxc-template/**"
      - ".gitea/workflows/postgres17-template.yaml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.gitea/workflows/lxc-template.yaml
    with:
      lxc-name: postgres17
      template-name: postgres17-debian12
      ostemplate: truenas:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst
      unprivileged: true
    secrets: inherit
