name: Docker LXC template CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "ansible/docker/docker-template.yaml"
      - "terraform/modules/lxc-template/**"
      - ".gitea/workflows/docker-template.yaml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.gitea/workflows/lxc-template.yaml
    with:
      lxc-name: docker
      template-name: docker-debian12
      ostemplate: truenas:vztmpl/debian-12-standard_12.2-1_amd64.tar.zst
      unprivileged: true
    secrets: inherit