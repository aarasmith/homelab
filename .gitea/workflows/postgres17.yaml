name: Postgres17 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "LXC/templates/Postgres17/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: git.arasmith.org/admin/gitea-runner-tools:latest

    defaults:
      run:
        working-directory: LXC/templates/Postgres17

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create credentials.auto.tfvars
        run: |
          cat > credentials.auto.tfvars <<EOF
          proxmox_api_url    = "${{ secrets.PVE_API_URL }}"
          proxmox_user       = "${{ secrets.PVE_USER }}"
          proxmox_password   = "${{ secrets.PVE_PASSWORD }}"
          lxc_password       = "${{ secrets.LXC_PASSWORD }}"
          ssh_public_key     = "${{ secrets.MASTER_SSH_PUBLIC_KEY }}"
          EOF

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run Ansible Playbook
        run: ansible-playbook -i hosts.ini Postgres17.yaml

      - name: Terraform Destroy
        if: always()
        run: terraform destroy -auto-approve -input=false
