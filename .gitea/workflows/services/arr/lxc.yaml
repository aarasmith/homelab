name: services | arr | lxc

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".gitea/workflows/services/arr/lxc.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Pass 'true' to force apply and post-deploy steps to run"
        required: false
        type: string

jobs:
  deploy:
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: arr
      base_template: docker-debian12.tar.gz
      vmid: "301"
      ip: ${{ github.ref_name == 'main' && '10.1.1.20/24' || '10.1.1.120/24' }}
      memory: "2048"
      cores: "1"
      storage_size: "16G"
      enable_docker: true
      unprivileged: true
      apply: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) || inputs.force == 'true' }}
    secrets: inherit
  
  wait-for-boot:
    needs: deploy
    if: ${{ needs.deploy.outputs.created == 'true' || inputs.force == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    steps:
      - name: Sleep to allow LXC to boot
        run: sleep 15
  # Safe/idempotent
  setup:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: services/arr/ansible/arr-setup.yaml
    secrets: inherit

  add-mount:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: ansible/common/add-unprivileged-nfs-mount.yaml
    secrets: inherit

  start-containers:
    needs: [setup, add-mount]
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: ansible/common/start-docker-containers.yaml
    secrets: inherit
    