name: services | arr | lxc

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".gitea/workflows/services/arr/lxc.yaml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: arr
      base_template: arr-debian12.tar.gz
      vmid: "301"
      ip: "10.1.1.20/24"
      memory: "2048"
      cores: "1"
      storage_size: "16G"
      enable_docker: true
      unprivileged: true
      apply: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) }}
    secrets: inherit
  
  wait-for-boot:
    needs: deploy
    if: ${{ needs.deploy.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    steps:
      - name: Sleep to allow LXC to boot
        run: sleep 15

  setup:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: services/arr/ansible/arr-setup.yaml
    secrets: inherit

  add-mount:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: ansible/common/add-unprivileged-nfs-mount.yaml
    secrets: inherit

  start-containers:
    needs: [setup, add-mount]
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: arr
      playbook: ansible/common/start-docker-containers.yaml
    secrets: inherit
    