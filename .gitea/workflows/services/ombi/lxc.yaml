name: services | ombi | lxc

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "feature/**"
    paths:
      - ".gitea/workflows/services/ombi/lxc.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: false
        type: choice
        default: deploy
        options:
          - deploy
          - update
          - backup
          - restore
      force:
        description: "Pass 'true' to force apply and post-deploy steps (deploy only)"
        required: false
        type: string

jobs:
  # ── DEPLOY PATH ──────────────────────────────────────────────────────────────
  setup-env:
    #provides `deploy_env` as an output
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    uses: ./.gitea/workflows/common/setup-env.yaml
        
  deploy:
    needs: setup-env
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: ombi
      base_template: docker-debian12.tar.gz
      vmid: "306"
      ip: ${{ needs.setup-env.outputs.deploy_env == 'prod' && '10.1.1.24/24' || '10.1.1.124/24' }}
      memory: "2048"
      cores: "1"
      storage_size: "16G"
      enable_docker: true
      unprivileged: true
      apply: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) || inputs.force == 'true' }}
    secrets: inherit

  wait-for-boot:
    needs: deploy
    if: ${{ needs.deploy.outputs.created == 'true' || inputs.force == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    steps:
      - name: Sleep to allow LXC to boot
        run: sleep 15
  # Safe/idempotent
  setup:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: ombi
      playbook: services/ombi/ansible/ombi-setup.yaml
    secrets: inherit

  add-backup-mount:
      needs: wait-for-boot
      uses: ./.gitea/workflows/common/lxc-ansible.yaml
      with:
        lxc_name: ombi
        playbook: ansible/common/add-backups-mount.yaml
        extra_vars: "env=${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
      secrets: inherit

  start-containers:
    needs: setup
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: ombi
      playbook: ansible/common/start-docker-containers.yaml
    secrets: inherit

  # ── MANUAL PATHS ─────────────────────────────────────────────────────────────
  start-lxc:
    if: ${{ inputs.action != 'deploy' }}
    uses: ./.gitea/workflows/common/lxc-start.yaml
    with:
      lxc_name: ombi
    secrets: inherit

  update:
    if: ${{ inputs.action == 'update' }}
    needs: start-lxc
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: ombi
      playbook: ansible/common/update-docker-lxc.yaml
    secrets: inherit

  backup:
    if: ${{ inputs.action == 'backup' }}
    needs: start-lxc
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: ombi
      playbook: ansible/common/backup-appdata.yaml
    secrets: inherit

  restore:
    if: ${{ inputs.action == 'restore' }}
    needs: start-lxc
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: ombi
      playbook: ansible/common/restore-appdata.yaml
    secrets: inherit
