name: services | kafka | update

on:
  workflow_dispatch:

jobs:
  start-lxc-1:
    uses: ./.gitea/workflows/common/lxc-start.yaml
    with:
      lxc_name: kafka-1
    secrets: inherit
  start-lxc-2:
    uses: ./.gitea/workflows/common/lxc-start.yaml
    with:
      lxc_name: kafka-2
    secrets: inherit
  start-lxc-3:
    uses: ./.gitea/workflows/common/lxc-start.yaml
    with:
      lxc_name: kafka-3
    secrets: inherit
  
  update:
    needs: [start-lxc-1, start-lxc-2, start-lxc-3]
    uses: ./.gitea/workflows/common/lxc-3-node-ansible.yaml
    with:
      service_name: kafka
      playbook: ansible/common/update-docker-lxc.yaml
    secrets: inherit