name: services | jellyfin | lxc

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
      - "feature/**"
    paths:
      - ".gitea/workflows/services/jellyfin/lxc.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Pass 'true' to force apply and post-deploy steps to run"
        required: false
        type: string

jobs:
  setup-env:
    #provides `deploy_env` as an output
    uses: ./.gitea/workflows/common/setup-env.yaml
        
  deploy:
    needs: setup-env
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: jellyfin
      base_template: debian-12-standard_12.12-1_amd64.tar.zst
      vmid: "302"
      ip: ${{ needs.setup-env.outputs.deploy_env == 'prod' && '10.1.1.21/24' || '10.1.1.121/24' }}
      memory: "4096"
      cores: "2"
      storage_size: "16G"
      enable_docker: false
      unprivileged: true
      apply: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) || inputs.force == 'true' }}
    secrets: inherit
  
  wait-for-boot:
    needs: deploy
    if: ${{ needs.deploy.outputs.created == 'true' || inputs.force == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    steps:
      - name: Sleep to allow LXC to boot
        run: sleep 15
  
  # Safe/idempotent
  setup:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: jellyfin
      playbook: services/jellyfin/ansible/jellyfin-setup.yaml
    secrets: inherit
       
  add-read-only-media-mount:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: jellyfin
      playbook: ansible/common/add-ro-media-mount.yaml
    secrets: inherit

  add-backup-mount:
      needs: wait-for-boot
      uses: ./.gitea/workflows/common/lxc-ansible.yaml
      with:
        lxc_name: jellyfin
        playbook: ansible/common/add-backups-mount.yaml
        extra_vars: "env=${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
      secrets: inherit

  add-igpu-passthrough:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: jellyfin
      playbook: ansible/common/add-igpu-passthrough.yaml
    secrets: inherit