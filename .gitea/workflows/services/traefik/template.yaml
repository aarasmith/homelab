name: services | traefik | template

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - "services/traefik/ansible/traefik-template.yaml"
      - "services/traefik/docker-compose.yaml"
      - ".gitea/workflows/services/traefik/template.yaml"
  workflow_dispatch:

jobs:
  create-template:
    uses: ./.gitea/workflows/common/lxc-template.yaml
    with:
      playbook: services/traefik/ansible/traefik-template.yaml
      lxc_name: traefik
      template_name: traefik-debian12
      base_template: docker-debian12.tar.gz
      enable_docker: true
      unprivileged: true
      dump_template: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) }}
    secrets: inherit
    