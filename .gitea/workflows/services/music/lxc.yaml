name: services | music | lxc

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".gitea/workflows/services/music/lxc.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Pass 'true' to force apply and post-deploy steps to run"
        required: false
        type: string

jobs:
  deploy:
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: music
      base_template: docker-debian12.tar.gz
      vmid: "305"
      ip: ${{ github.ref_name == 'main' && '10.1.1.23/24' || '10.1.1.123/24' }}
      memory: "2048"
      cores: "1"
      storage_size: "16G"
      enable_docker: true
      unprivileged: true
      apply: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) || inputs.force == 'true' }}
    secrets: inherit

  wait-for-boot:
    needs: deploy
    if: ${{ needs.deploy.outputs.created == 'true' || inputs.force == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
    steps:
      - name: Sleep to allow LXC to boot
        run: sleep 15
  # Safe/idempotent
  setup:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: music
      playbook: services/music/ansible/music-setup.yaml
    secrets: inherit

  add-media-mount:
    needs: wait-for-boot
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: music
      playbook: ansible/common/add-unprivileged-nfs-mount.yaml
    secrets: inherit

  add-backup-mount:
      needs: wait-for-boot
      uses: ./.gitea/workflows/common/lxc-ansible.yaml
      with:
        lxc_name: music
        playbook: ansible/common/add-backups-mount.yaml
        extra_vars: "env=${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
      secrets: inherit

  start-containers:
    needs: add-media-mount
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: music
      playbook: ansible/common/start-docker-containers.yaml
    secrets: inherit
