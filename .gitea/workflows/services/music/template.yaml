name: services | music | template

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - "services/music/ansible/music-template.yaml"
      - "services/music/docker-compose.yaml"
      - ".gitea/workflows/services/music/template.yaml"
  workflow_dispatch:

jobs:
  create-template:
    uses: ./.gitea/workflows/common/lxc-template.yaml
    with:
      playbook: services/music/ansible/music-template.yaml
      lxc_name: music
      template_name: music-debian12
      base_template: docker-debian12.tar.gz
      enable_docker: true
      unprivileged: true
    secrets: inherit
