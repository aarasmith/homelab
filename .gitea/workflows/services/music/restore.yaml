name: services | music | restore

on:
  workflow_dispatch:

jobs:
  start-lxc:
    uses: ./.gitea/workflows/common/lxc-start.yaml
    with:
      lxc_name: music
    secrets: inherit

  restore:
    needs: start-lxc
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: music
      playbook: ansible/common/restore-appdata.yaml
    secrets: inherit