name: Airflow Migration CI/CD

on:
  workflow_dispatch:
    inputs:
      source_host:
        description: "IP address of the existing Airflow LXC to migrate from"
        required: true
        type: string

jobs:
  migration:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scope PVE vars to current environment
        uses: ./.gitea/actions/normalize-pve-env
        with:
          secrets_json: ${{ toJson(secrets) }}
          vars_json: ${{ toJson(vars) }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MASTER_SSH_PRIVATE_KEY }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${PVE_NODE_IP} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ inputs.source_host }} >> ~/.ssh/known_hosts

      - name: Lookup destination LXC VMID and IP
        uses: ./.gitea/actions/lookup-lxc-vmid-ip
        with:
          pve_node_ip: ${PVE_NODE_IP}
          lxc_name: airflow

      - name: Render hosts.ini
        run: |
          cat > hosts.ini <<EOF
          [lxc]
          airflow ansible_host=${LXC_IP} ansible_user=root

          [source]
          source ansible_host=${{ inputs.source_host }} ansible_user=root
          EOF

      - name: Debug hosts.ini
        run: cat hosts.ini

      - name: Run migration playbook
        shell: bash
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: ansible-playbook -i hosts.ini ansible/airflow/airflow-migration.yaml --vault-password-file <(echo "$ANSIBLE_VAULT_PASSWORD")