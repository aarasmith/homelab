name: Airflow LXC CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".gitea/workflows/services/airflow/lxc.yaml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.gitea/workflows/common/lxc-terraform.yaml
    with:
      target_node: "mother"
      lxc_name: airflow
      base_template: airflow-debian12.tar.gz
      vmid: "303"
      ip: ${{ github.ref_name == 'main' && '10.1.1.30/24' || '10.1.1.130/24' }}
      memory: "4096"
      cores: "2"
      storage_size: "32G"
      enable_docker: true
      unprivileged: true
    secrets: inherit

  post-deploy:
    needs: deploy
    uses: ./.gitea/workflows/common/lxc-post-deploy.yaml
    with:
      vmid: "303"
    secrets: inherit

  start:
    if: ${{ contains(fromJSON('["main","dev"]'), github.ref_name) }}
    needs: post-deploy
    uses: ./.gitea/workflows/common/lxc-ansible.yaml
    with:
      lxc_name: airflow
      playbook: services/airflow/ansible/airflow-start.yaml
    secrets: inherit
    