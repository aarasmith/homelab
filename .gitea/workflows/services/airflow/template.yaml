name: Airflow LXC template CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - "services/airflow/ansible/airflow-template.yaml"
      - "services/airflow/docker-compose.yaml"
      - ".gitea/workflows/services/airflow/template.yaml"
  workflow_dispatch:

jobs:
  create-template:
    uses: ./.gitea/workflows/common/lxc-template.yaml
    with:
      playbook: services/airflow/ansible/airflow-template.yaml
      lxc_name: airflow
      template_name: airflow-debian12
      base_template: docker-debian12.tar.gz
      enable_docker: true
      unprivileged: true
    secrets: inherit