name: "Lookup LXC VMID and Node"
description: "Find VMID and node of a Proxmox LXC via pvesh and expose as outputs"

inputs:
  lxc_name:
    description: "Name of the LXC container to look up"
    required: true

outputs:
  vmid:
    description: "VMID of the LXC container"
    value: ${{ steps.lookup.outputs.vmid }}
  node:
    description: "Node of the LXC container"
    value: ${{ steps.lookup.outputs.node }}

runs:
  using: "composite"
  steps:
    - name: Lookup environment
      id: lookup-env
      uses: ./.gitea/actions/lookup-env

    - id: lookup
      shell: bash
      run: |
        sleep 15

        PVE_LOOKUP_IP=${{ steps.lookup-env.outputs.env == 'prod' && vars.PVE_DEFAULT_NODE_IP || vars.PVE_DEFAULT_NODE_IP_DEV }}

        VMID=$(ssh -oBatchMode=yes root@${PVE_LOOKUP_IP} \
          "pvesh get /cluster/resources --type vm --output-format yaml \
          | awk -v target='${{ inputs.lxc_name }}' '
              /^[[:space:]]*name:/ {
                split(\$0, a, \": \")
                if (a[2] == target) found=1
              }
              found && /^[[:space:]]*vmid:/ {print \$2; exit}'")

        if [ -z "$VMID" ]; then
          echo "ERROR: VMID not found for ${{ inputs.lxc_name }}"
          exit 1
        fi

        NODE=$(ssh -oBatchMode=yes root@${PVE_LOOKUP_IP} \
          "pvesh get /cluster/resources --type vm --output-format yaml \
          | awk -v target='${{ inputs.lxc_name }}' '
              /^[[:space:]]*name:/ {
                split(\$0, a, \": \")
                if (a[2] == target) found=1
              }
              found && /^[[:space:]]*node:/ {print \$2; exit}'")

        if [ -z "$NODE" ]; then
          echo "ERROR: Node not found for ${{ inputs.lxc_name }}"
          exit 1
        fi

        echo "vmid=$VMID" >> "$GITHUB_OUTPUT"
        echo "node=$NODE" >> "$GITHUB_OUTPUT"