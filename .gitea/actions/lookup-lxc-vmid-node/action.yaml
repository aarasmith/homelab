name: "Lookup LXC VMID and Node"
description: "Find VMID and node of a Proxmox LXC via pvesh and export as env vars"

inputs:
  lxc_name:
    description: "Name of the LXC container to look up"
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        sleep 15

        PVE_LOOKUP_IP=${{ github.ref_name == 'main' && vars.PVE_NODE_IP || vars.PVE_NODE_IP_DEV }}

        VMID=$(ssh -oBatchMode=yes root@${PVE_LOOKUP_IP} \
          "pvesh get /cluster/resources --type vm --output-format yaml \
          | awk -v target='${{ inputs.lxc_name }}' '
              /^[[:space:]]*name:/ {
                split(\$0, a, \": \")
                if (a[2] == target) found=1
              }
              found && /^[[:space:]]*vmid:/ {print \$2; exit}'")

        if [ -z "$VMID" ]; then
          echo "ERROR: VMID not found for ${{ inputs.lxc_name }}"
          exit 1
        fi

        NODE=$(ssh -oBatchMode=yes root@${PVE_LOOKUP_IP} \
          "pvesh get /cluster/resources --type vm --output-format yaml \
          | awk -v target='${{ inputs.lxc_name }}' '
              /^[[:space:]]*name:/ {
                split(\$0, a, \": \")
                if (a[2] == target) found=1
              }
              found && /^[[:space:]]*node:/ {print \$2; exit}'")

        if [ -z "$NODE" ]; then
          echo "ERROR: Node not found for ${{ inputs.lxc_name }}"
          exit 1
        fi

        echo "LXC_VMID=$VMID" >> $GITHUB_ENV
        echo "LXC_NODE=$NODE" >> $GITHUB_ENV