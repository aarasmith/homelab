name: "Normalize AWS environment variables"
description: "Normalize prod/dev secrets & vars into canonical AWS_* env vars"

inputs:
  secrets_json:
    required: true
    description: "All secrets as JSON (use toJson(secrets))"
  vars_json:
    required: true
    description: "All vars as JSON (use toJson(vars))"

outputs:
  aws_tf_backend_bucket:
    description: "Bucket for terraform backend state file"
    value: ${{ steps.scope-env.outputs.aws_tf_backend_bucket }}

runs:
  using: "composite"
  steps:
    - name: Lookup environment
      id: lookup-env
      uses: ./.gitea/actions/lookup-env

    - name: Scope AWS vars/secrets
      id: scope-env
      shell: bash
      run: |
        SECRETS='${{ inputs.secrets_json }}'
        VARS='${{ inputs.vars_json }}'

        if [ "${{ steps.lookup-env.outputs.env  }}" = "prod" ]; then
          echo "aws_tf_backend_bucket=$(echo "$VARS" | jq -r '.AWS_TF_BACKEND_BUCKET')" >> $GITHUB_OUTPUT
        else
          echo "aws_tf_backend_bucket=$(echo "$VARS" | jq -r '.AWS_TF_BACKEND_BUCKET_DEV')" >> $GITHUB_OUTPUT
        fi
