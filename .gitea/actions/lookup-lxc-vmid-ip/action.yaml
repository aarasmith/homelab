name: "Lookup LXC VMID and IP"
description: "Find VMID and IP of a Proxmox LXC and export as outputs/env"

inputs:
  pve_node_ip:
    description: "IP address of the Proxmox node"
    required: true
  lxc_name:
    description: "Name of the LXC container to look up"
    required: true

outputs:
  vmid:
    description: "VMID of the LXC"
    value: ${{ steps.lookup.outputs.vmid }}
  ip:
    description: "IP of the LXC"
    value: ${{ steps.lookup.outputs.ip }}

runs:
  using: "composite"
  steps:
    - id: lxc-lookup
      shell: bash
      run: |
        sleep 15
        # Lookup VMID
        VMID=$(ssh -oBatchMode=yes root@${{ inputs.pve_node_ip }} \
          "pvesh get /cluster/resources --type vm --output-format yaml \
          | awk -v target='${{ inputs.lxc_name }}' '
              /^[[:space:]]*name:/ {
                split(\$0, a, \": \")
                if (a[2] == target) found=1
              }
              found && /^[[:space:]]*vmid:/ {print \$2; exit}'")

        if [ -z "$VMID" ]; then
          echo "ERROR: VMID not found for ${{ inputs.lxc_name }}"
          exit 1
        fi

        # Lookup IP
        IP=$(ssh -oBatchMode=yes root@${{ inputs.pve_node_ip }} \
          "pct exec $VMID ip addr show | grep -oP '(?<=inet )10\.1\.1\.\d+'")

        echo "vmid=$VMID" >> $GITHUB_OUTPUT
        echo "ip=$IP" >> $GITHUB_OUTPUT
        echo "LXC_VMID=$VMID" >> $GITHUB_ENV
        echo "LXC_IP=$IP" >> $GITHUB_ENV
