name: "Normalize PVE environment variables"
description: "Normalize prod/dev secrets & vars into canonical PVE_* env vars"

inputs:
  secrets_json:
    required: true
    description: "All secrets as JSON (use toJson(secrets))"
  vars_json:
    required: true
    description: "All vars as JSON (use toJson(vars))"
  target_node:
    required: false
    description: "PVE node name to derive SSH IP from (mother, fish, fastfood). Defaults to mother."

runs:
  using: "composite"
  steps:
    - name: Normalize PVE vars/secrets
      shell: bash
      run: |
        SECRETS='${{ inputs.secrets_json }}'
        VARS='${{ inputs.vars_json }}'

        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "PVE_USER=$(echo "$SECRETS" | jq -r '.PVE_USER')" >> $GITHUB_ENV
          echo "PVE_DISK_STORAGE=$(echo "$VARS" | jq -r '.PVE_DISK_STORAGE')" >> $GITHUB_ENV
          echo "PVE_DEFAULT_TARGET_NODE=$(echo "$VARS" | jq -r '.PVE_DEFAULT_TARGET_NODE')" >> $GITHUB_ENV
          echo "PVE_API_URL=$(echo "$VARS" | jq -r '.PVE_API_URL')" >> $GITHUB_ENV
          echo "PVE_PASSWORD=$(echo "$SECRETS" | jq -r '.PVE_PASSWORD')" >> $GITHUB_ENV
          echo "PVE_TEMPLATES_DIR=$(echo "$VARS" | jq -r '.PVE_TEMPLATES_DIR')" >> $GITHUB_ENV
          case "${{ inputs.target_node }}" in
            fish)     echo "PVE_NODE_IP=$(echo "$VARS" | jq -r '.PVE_NODE_IP_FISH')" >> $GITHUB_ENV ;;
            fastfood) echo "PVE_NODE_IP=$(echo "$VARS" | jq -r '.PVE_NODE_IP_FASTFOOD')" >> $GITHUB_ENV ;;
            *)        echo "PVE_NODE_IP=$(echo "$VARS" | jq -r '.PVE_NODE_IP_MOTHER')" >> $GITHUB_ENV ;;
          esac
        else
          echo "PVE_USER=$(echo "$SECRETS" | jq -r '.PVE_USER_DEV')" >> $GITHUB_ENV
          echo "PVE_PASSWORD=$(echo "$SECRETS" | jq -r '.PVE_PASSWORD_DEV')" >> $GITHUB_ENV
          echo "PVE_DISK_STORAGE=$(echo "$VARS" | jq -r '.PVE_DISK_STORAGE_DEV')" >> $GITHUB_ENV
          echo "PVE_DEFAULT_TARGET_NODE=$(echo "$VARS" | jq -r '.PVE_DEFAULT_TARGET_NODE_DEV')" >> $GITHUB_ENV
          echo "PVE_API_URL=$(echo "$VARS" | jq -r '.PVE_API_URL_DEV')" >> $GITHUB_ENV
          echo "PVE_TEMPLATES_DIR=$(echo "$VARS" | jq -r '.PVE_TEMPLATES_DIR_DEV')" >> $GITHUB_ENV
          echo "PVE_NODE_IP=$(echo "$VARS" | jq -r '.PVE_NODE_IP_DEV')" >> $GITHUB_ENV
        fi